if {[catch {find interface/stlink-dap.cfg} stlink_interface]} {
    set stlink_interface [find interface/stlink.cfg]
    source $stlink_interface
    transport select swd
} else {
    source $stlink_interface
    transport select dapdirect_swd
}
source [find target/stm32f4x.cfg]
stm32f4x.cpu configure -work-area-backup 1
adapter speed 1800
