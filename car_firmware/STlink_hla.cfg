# Compatibility configuration for ST-Link probes whose Vref measurement is
# known to be incorrect but whose SWD data path has been independently verified.
# Prefer STlink.cfg for probes that work with OpenOCD's current st-link backend.
# OpenOCD 0.12 names the HLA interface stlink.cfg; newer builds split it out.
if {[catch {find interface/stlink-hla.cfg} hla_interface]} {
    set hla_interface [find interface/stlink.cfg]
}
source $hla_interface
transport select hla_swd
source [find target/stm32f4x.cfg]
# Flash/CRC algorithms share SRAM with application state. Preserve it, and
# reset after these target-executed algorithms before normal operation.
# For live inspection use readback; CRC execution can let RTOS interrupts run.
stm32f4x.cpu configure -work-area-backup 1

# This probe is reliable at 100 kHz for reset, register access, and debugging.
# V2J48M35 Flash writes were verified at 1800 kHz; use `adapter speed 1800`
# after `reset halt` when programming to avoid the low-speed algorithm timeout.
adapter speed 100
stm32f4x.cpu configure -event reset-start {
    adapter speed 100
}
