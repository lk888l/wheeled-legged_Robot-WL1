# Compatibility configuration for ST-Link probes whose Vref measurement is
# known to be incorrect but whose SWD data path has been independently verified.
# Prefer STlink.cfg for probes that work with OpenOCD's current st-link backend.
source [find interface/stlink-hla.cfg]
transport select hla_swd
source [find target/stm32f4x.cfg]

# This probe is reliable at 100 kHz for reset, register access, and debugging.
# Large Flash writes are tested at 400 kHz; override with `adapter speed 400`
# before `init` when programming to avoid the low-speed algorithm timeout.
adapter speed 100
stm32f4x.cpu configure -event reset-start {
    adapter speed 100
}
